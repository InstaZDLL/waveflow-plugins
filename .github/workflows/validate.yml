# Validates registry.json against schema/registry.schema.json on every
# push + PR, so a malformed or schema-breaking plugin entry can't land.

name: validate-registry

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validator
        run: npm install --no-save ajv@8 ajv-formats@3

      - name: Validate registry.json against the schema
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          // The schema is JSON Schema draft 2020-12 — use Ajv's 2020 build,
          // not the default (draft-07) export, or it can't load the meta-schema.
          import Ajv from 'ajv/dist/2020.js';
          import addFormats from 'ajv-formats';

          const schema = JSON.parse(fs.readFileSync('schema/registry.schema.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('registry.json', 'utf8'));

          const ajv = new Ajv({ allErrors: true, strict: false });
          addFormats(ajv);
          const validate = ajv.compile(schema);

          if (!validate(data)) {
            console.error('registry.json failed schema validation:');
            for (const e of validate.errors) console.error(`  ${e.instancePath || '/'} ${e.message}`);
            process.exit(1);
          }

          // Extra invariants the JSON Schema can't express cheaply.
          const ids = new Set();
          for (const p of data.plugins) {
            if (ids.has(p.id)) { console.error(`duplicate plugin id: ${p.id}`); process.exit(1); }
            ids.add(p.id);
          }
          console.log(`OK — ${data.plugins.length} plugin(s), no duplicate ids.`);
          EOF

      - name: Schema self-tests (library_read_artists is ui-world-only)
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import Ajv from 'ajv/dist/2020.js';
          import addFormats from 'ajv-formats';

          const schema = JSON.parse(fs.readFileSync('schema/registry.schema.json', 'utf8'));
          const ajv = new Ajv({ allErrors: true, strict: false });
          addFormats(ajv);
          // Compile the entry sub-schema directly so fixtures don't need a
          // full { schema_version, plugins:[...] } wrapper.
          const entry = ajv.compile(schema.$defs.entry);

          const base = {
            id: 'x', name: 'X', description: 'd', author: 'a', repo: 'o/r',
            version: '0.1.0', blake3: '0'.repeat(64),
          };
          const perms = (lib) => ({
            http: [], storage_read: false, storage_state: true,
            ...(lib !== undefined ? { library_read_artists: lib } : {}),
          });

          // [name, entry, shouldValidate]
          const cases = [
            ['ui + library_read_artists:true',  { ...base, world: 'waveflow:ui/v1',       permissions: perms(true)  }, true],
            ['ui + library_read_artists:false', { ...base, world: 'waveflow:ui/v1',       permissions: perms(false) }, true],
            ['metadata, permission omitted',    { ...base, world: 'waveflow:metadata/v1', permissions: perms()      }, true],
            // Presence at `false` is a no-op — the conditional keys off
            // `const: true`, so a non-ui plugin explicitly setting it false
            // must NOT be rejected.
            ['source + library_read_artists:false', { ...base, world: 'waveflow:source/v1', permissions: perms(false) }, true],
            // The point of the conditional: a non-ui entry granting the
            // ui-only artist read must be rejected.
            ['source + library_read_artists:true',   { ...base, world: 'waveflow:source/v1',   permissions: perms(true) }, false],
            ['metadata + library_read_artists:true', { ...base, world: 'waveflow:metadata/v1', permissions: perms(true) }, false],
          ];

          let failed = false;
          for (const [name, fixture, expected] of cases) {
            const got = entry(fixture);
            if (got !== expected) {
              failed = true;
              console.error(`  FAIL: "${name}" expected ${expected ? 'valid' : 'invalid'}, got ${got ? 'valid' : 'invalid'}`);
            }
          }
          if (failed) process.exit(1);
          console.log(`OK — ${cases.length} schema self-tests passed.`);
          EOF
